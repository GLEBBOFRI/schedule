name: Auto Sync ITMO Schedule

on:
  schedule:
    - cron: '0 */6 * * *'  # Запуск каждые 6 часов
  workflow_dispatch:        # Ручной запуск из вкладки Actions

permissions:
  contents: write
  secrets: write            # Дает доступ утилите gh на обновление Secrets

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск скрипта обновления
        env:
          ITMO_REFRESH_TOKEN: ${{ secrets.ITMO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Токен для записи секретов через CLI
        run: python update_schedule.py

      - name: Сохранение изменений в репозиторий
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add schedule_cache.db itmo_schedule.ics || true
          git commit -m "Auto-update schedule .ics [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
