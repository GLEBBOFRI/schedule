name: Auto Sync ITMO Schedule

on:
  schedule:
    - cron: '0 */6 * * *'  # Запуск каждые 6 часов
  workflow_dispatch:        # Ручной запуск из вкладки Actions
    inputs:
      full_sync:
        description: 'Полная синхронизация на весь семестр (90 дней)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск тестов
        run: python test_sync.py

      - name: Запуск скрипта обновления
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ITMO_REFRESH_TOKEN: ${{ secrets.ITMO_REFRESH_TOKEN }}
          FULL_SYNC: ${{ github.event.inputs.full_sync }}
        run: python update_schedule.py

      - name: Сохранение изменений в репозиторий
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add schedule_cache.db itmo_schedule.ics || true
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update schedule .ics [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
